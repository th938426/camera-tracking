<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>YOLO AI Object Tracking</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
body{position:fixed;inset:0}
#app{position:fixed;inset:0;background:#000;overflow:hidden}
#video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#video{background:#000}
#overlay{pointer-events:none}
.top{position:absolute;top:max(env(safe-area-inset-top),12px);left:12px;right:12px;z-index:10;display:flex;gap:8px;justify-content:space-between;pointer-events:none}
.badges{display:flex;gap:7px;flex-wrap:wrap}
.badge{background:rgba(10,15,25,.78);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700}
.bottom{position:absolute;z-index:10;left:10px;right:10px;bottom:max(env(safe-area-inset-bottom),10px);display:grid;gap:8px}
.panel{background:rgba(8,13,23,.84);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);border-radius:16px;padding:10px}
.row{display:grid;grid-template-columns:92px 1fr 48px;align-items:center;gap:8px;margin:5px 0}
.row label{font-size:11px;color:#cbd5e1}
.row output{font-size:11px;text-align:right;font-weight:700}
input[type=range]{width:100%;accent-color:#22d3ee}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{min-height:44px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:#1e293b;color:#fff;font-weight:700;font-size:13px}
button.primary{background:linear-gradient(135deg,#0284c7,#2563eb)}
#loading{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;background:#070b12}
.loader{width:46px;height:46px;border:4px solid rgba(255,255,255,.15);border-top-color:#22d3ee;border-radius:50%;animation:spin 1s linear infinite;margin:auto auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
#msg{font-size:13px;color:#cbd5e1;line-height:1.5;max-width:360px}
#err{margin-top:12px;color:#fca5a5;font-size:12px;white-space:pre-wrap}
.hidden{display:none!important}
@media (min-width:700px){
 .bottom{max-width:520px;left:50%;right:auto;width:calc(100% - 24px);transform:translateX(-50%)}
}
</style>
</head>
<body>
<div id="app">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>

  <div class="top">
    <div class="badges">
      <div class="badge" id="status">● YOLO26</div>
      <div class="badge" id="fps">0 FPS</div>
      <div class="badge" id="count">0 vật thể</div>
    </div>
  </div>

  <div id="loading">
    <div>
      <div class="loader"></div>
      <h2 style="font-size:18px;margin-bottom:8px">Đang khởi động YOLO AI</h2>
      <div id="msg">Đang tải ONNX Runtime và mô hình YOLO26n...</div>
      <div id="err"></div>
    </div>
  </div>

  <div class="bottom">
    <div class="panel">
      <div class="row">
        <label>Độ tin cậy</label>
        <input id="conf" type="range" min="15" max="90" value="35">
        <output id="confOut">35%</output>
      </div>
      <div class="row">
        <label>Độ mượt</label>
        <input id="smooth" type="range" min="15" max="90" value="55">
        <output id="smoothOut">55%</output>
      </div>
      <div class="row">
        <label>Zoom</label>
        <input id="zoom" type="range" min="0.5" max="4" step="0.1" value="1">
        <output id="zoomOut">1.0×</output>
      </div>
    </div>
    <div class="buttons">
      <button id="flip">↔ Đổi camera</button>
      <button id="pause" class="primary">Tạm dừng</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.2/dist/ort.min.js"></script>
<script>
const MODEL_URL="https://huggingface.co/flotek/yolo26n-onnx/resolve/main/model.onnx";
const INPUT=640;
const COCO=[
"person","bicycle","car","motorcycle","airplane","bus","train","truck","boat","traffic light",
"fire hydrant","stop sign","parking meter","bench","bird","cat","dog","horse","sheep","cow",
"elephant","bear","zebra","giraffe","backpack","umbrella","handbag","tie","suitcase","frisbee",
"skis","snowboard","sports ball","kite","baseball bat","baseball glove","skateboard","surfboard",
"tennis racket","bottle","wine glass","cup","fork","knife","spoon","bowl","banana","apple",
"sandwich","orange","broccoli","carrot","hot dog","pizza","donut","cake","chair","couch",
"potted plant","bed","dining table","toilet","tv","laptop","mouse","remote","keyboard","cell phone",
"microwave","oven","toaster","sink","refrigerator","book","clock","vase","scissors","teddy bear",
"hair drier","toothbrush"
];

const video=document.getElementById("video"), canvas=document.getElementById("overlay"), ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status"), fpsEl=document.getElementById("fps"), countEl=document.getElementById("count");
const loading=document.getElementById("loading"), msg=document.getElementById("msg"), err=document.getElementById("err");
const conf=document.getElementById("conf"), smooth=document.getElementById("smooth"), zoom=document.getElementById("zoom");
const confOut=document.getElementById("confOut"), smoothOut=document.getElementById("smoothOut"), zoomOut=document.getElementById("zoomOut");

let session=null, stream=null, facing="environment", running=true, detecting=false, raf=0;
let confidence=.35, smoothFactor=.55, tracks=[], nextId=1, lastDetections=[];
let frames=0,lastFps=performance.now(),fps=0, lastInfer=0;

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(innerWidth*dpr); canvas.height=Math.round(innerHeight*dpr);
  canvas.style.width=innerWidth+"px"; canvas.style.height=innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize); addEventListener("orientationchange",()=>setTimeout(resize,150)); resize();

function iou(a,b){
 const ax2=a.x+a.w, ay2=a.y+a.h, bx2=b.x+b.w, by2=b.y+b.h;
 const x1=Math.max(a.x,b.x),y1=Math.max(a.y,b.y),x2=Math.min(ax2,bx2),y2=Math.min(ay2,by2);
 const iw=Math.max(0,x2-x1),ih=Math.max(0,y2-y1), inter=iw*ih;
 return inter/(a.w*a.h+b.w*b.h-inter+1e-6);
}
function centerDist(a,b){
 const ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;
 return Math.hypot(ax-bx,ay-by)/Math.max(1,Math.hypot(a.w,a.h));
}
function color(id){return `hsl(${(id*67)%360} 90% 60%)`}

function matchTracks(dets){
 const used=new Set();
 const candidates=[];
 tracks.forEach((t,ti)=>dets.forEach((d,di)=>{
   if(t.label!==d.label)return;
   const ov=iou(t.box,d.box), dist=centerDist(t.box,d.box);
   const score=ov*0.72+Math.max(0,1-dist/1.8)*0.28;
   if(score>.20)candidates.push({ti,di,score});
 }));
 candidates.sort((a,b)=>b.score-a.score);
 for(const c of candidates){
   if(used.has(c.di))continue;
   const t=tracks[c.ti]; if(t.matched)continue;
   const d=dets[c.di];
   t.box={...d.box}; t.conf=d.conf; t.age=0; t.matched=true; used.add(c.di);
 }
 const fresh=[];
 dets.forEach((d,i)=>{if(!used.has(i))fresh.push({...d, id:nextId++, age:0, missing:0, color:color(nextId)});});
 tracks.forEach(t=>t.matched=false);
 tracks=tracks.filter(t=>t.missing<8);
 tracks.forEach(t=>{if(!used.has(-1)){}});
 // Increment missing for tracks not refreshed using age marker.
 const refreshed=new Set();
 candidates.forEach(c=>{if(used.has(c.di))refreshed.add(c.ti)});
 tracks.forEach((t,ti)=>{ if(!refreshed.has(ti)) t.missing=(t.missing||0)+1; });
 tracks.push(...fresh);
 // Smooth after association.
 tracks.forEach(t=>{
   if(!t.smoothBox)t.smoothBox={...t.box};
   const k=smoothFactor;
   for(const key of ["x","y","w","h"])t.smoothBox[key]+= (t.box[key]-t.smoothBox[key])*k;
 });
}

function preprocess(){
 const vw=video.videoWidth,vh=video.videoHeight;
 const scale=Math.min(INPUT/vw,INPUT/vh);
 const nw=Math.round(vw*scale),nh=Math.round(vh*scale);
 const padX=(INPUT-nw)/2,padY=(INPUT-nh)/2;
 const c=document.createElement("canvas");c.width=INPUT;c.height=INPUT;
 const x=c.getContext("2d");x.fillStyle="#000";x.fillRect(0,0,INPUT,INPUT);x.drawImage(video,padX,padY,nw,nh);
 const img=x.getImageData(0,0,INPUT,INPUT).data;
 const data=new Float32Array(3*INPUT*INPUT);
 let p=0;
 for(let i=0;i<img.length;i+=4){data[p]=img[i]/255;data[INPUT*INPUT+p]=img[i+1]/255;data[2*INPUT*INPUT+p]=img[i+2]/255;p++}
 return {tensor:new ort.Tensor("float32",data,[1,3,INPUT,INPUT]),scale,padX,padY,nw,nh};
}

function mapBox(x1,y1,x2,y2,prep){
 // Model output is normalized 0..1 according to the selected YOLO26 ONNX model.
 x1*=INPUT;y1*=INPUT;x2*=INPUT;y2*=INPUT;
 const vx=(x1-prep.padX)/prep.scale,vy=(y1-prep.padY)/prep.scale;
 const vw=(x2-x1)/prep.scale,vh=(y2-y1)/prep.scale;
 return {x:Math.max(0,vx),y:Math.max(0,vy),w:Math.max(1,vw),h:Math.max(1,vh)};
}

function cameraToScreen(b){
 const vw=video.videoWidth,vh=video.videoHeight,sw=innerWidth,sh=innerHeight;
 const s=Math.max(sw/vw,sh/vh),rw=vw*s,rh=vh*s;
 const ox=(sw-rw)/2,oy=(sh-rh)/2;
 return {x:b.x*s+ox,y:b.y*s+oy,w:b.w*s,h:b.h*s};
}

async function detect(){
 if(!session||detecting||!running||video.readyState<4)return;
 detecting=true;
 try{
   const prep=preprocess();
   const inputName=session.inputNames[0];
   const out=await session.run({[inputName]:prep.tensor});
   const tensor=out[session.outputNames[0]];
   const a=tensor.data, dims=tensor.dims;
   const dets=[];
   // Expected YOLO26 browser-ready export: [1,300,6] = x1,y1,x2,y2,score,class.
   const n=dims[dims.length-2], stride=6;
   for(let i=0;i<n;i++){
     const o=i*stride;
     let x1=a[o],y1=a[o+1],x2=a[o+2],y2=a[o+3],score=a[o+4],cls=Math.round(a[o+5]);
     if(score<confidence||cls<0||cls>=COCO.length)continue;
     // Accept normalized coordinates; tolerate pixel-coordinate exports.
     if(Math.max(x1,y1,x2,y2)>1.5){x1/=INPUT;y1/=INPUT;x2/=INPUT;y2/=INPUT;}
     const box=mapBox(x1,y1,x2,y2,prep);
     if(box.w<8||box.h<8)continue;
     dets.push({label:COCO[cls],conf:score,box});
   }
   dets.sort((a,b)=>b.conf-a.conf);
   matchTracks(dets.slice(0,80));
   lastDetections=dets;
   countEl.textContent=tracks.length+" vật thể";
 }catch(e){console.error(e)}
 detecting=false;
}

function draw(){
 ctx.clearRect(0,0,innerWidth,innerHeight);
 if(running){
   tracks.forEach(t=>{
     const b=cameraToScreen(t.smoothBox), c=t.color||color(t.id);
     ctx.strokeStyle=c;ctx.lineWidth=2.5;ctx.strokeRect(b.x,b.y,b.w,b.h);
     const label=`#${t.id} ${t.label} ${Math.round(t.conf*100)}%`;
     ctx.font="700 13px system-ui";
     const tw=ctx.measureText(label).width+12,th=24,ty=b.y>th?b.y-th:b.y;
     ctx.fillStyle="rgba(5,10,18,.88)";ctx.fillRect(b.x,ty,tw,th);
     ctx.fillStyle=c;ctx.fillRect(b.x,ty,3,th);
     ctx.fillStyle="#fff";ctx.fillText(label,b.x+8,ty+16);
   });
 }
 frames++;
 const now=performance.now();
 if(now-lastFps>=1000){fps=frames;frames=0;lastFps=now;fpsEl.textContent=fps+" FPS";}
 raf=requestAnimationFrame(draw);
}
async function startCamera(){
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{
   facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}
 }});
 video.srcObject=stream;await video.play();
 tracks=[];lastDetections=[];
 setupZoom();
}
function setupZoom(){
 const track=stream?.getVideoTracks?.()[0]; if(!track)return;
 const caps=track.getCapabilities?.()||{}, settings=track.getSettings?.()||{};
 if(caps.zoom){
   zoom.min=Math.max(.5,caps.zoom.min??.5); zoom.max=caps.zoom.max??4; zoom.step=caps.zoom.step||.1;
   zoom.value=Math.min(Math.max(settings.zoom??1,+zoom.min),+zoom.max);
   zoomOut.textContent=Number(zoom.value).toFixed(1)+"×";
 }else{
   zoom.min=.5;zoom.max=4;zoom.value=1;zoomOut.textContent="1.0× (camera không hỗ trợ)";
 }
}
zoom.addEventListener("input",async()=>{
 zoomOut.textContent=Number(zoom.value).toFixed(1)+"×";
 const track=stream?.getVideoTracks?.()[0];const caps=track?.getCapabilities?.()||{};
 if(caps.zoom){
   const z=Math.min(Math.max(+zoom.value,caps.zoom.min),caps.zoom.max);
   try{await track.applyConstraints({advanced:[{zoom:z}]})}catch(e){}
 }
});
conf.addEventListener("input",()=>{confidence=+conf.value/100;confOut.textContent=conf.value+"%"});
smooth.addEventListener("input",()=>{smoothFactor=+smooth.value/100;smoothOut.textContent=smooth.value+"%"});
document.getElementById("pause").onclick=()=>{
 running=!running;document.getElementById("pause").textContent=running?"Tạm dừng":"Tiếp tục";
 if(!running){tracks=[];ctx.clearRect(0,0,innerWidth,innerHeight)}
};
document.getElementById("flip").onclick=async()=>{
 facing=facing==="environment"?"user":"environment";
 try{await startCamera()}catch(e){err.textContent=e.message}
};

async function main(){
 try{
   msg.textContent="Đang chọn WebGPU/WebAssembly...";
   if(ort.env?.wasm)ort.env.wasm.numThreads=Math.min(4,navigator.hardwareConcurrency||2);
   const providers=["webgpu","wasm"];
   msg.textContent="Đang tải YOLO26n (~4.8 MB)...";
   session=await ort.InferenceSession.create(MODEL_URL,{
     executionProviders:providers,
     graphOptimizationLevel:"all"
   });
   msg.textContent="Đang mở camera...";
   await startCamera();
   statusEl.textContent="● YOLO26 AI";
   loading.classList.add("hidden");
   draw();
   const loop=async()=>{if(running&&performance.now()-lastInfer>120){lastInfer=performance.now();await detect()}setTimeout(loop,0)};loop();
 }catch(e){
   err.textContent=String(e?.message||e);
   msg.textContent="Không thể khởi động. Hãy mở bằng HTTPS/localhost và cho phép Camera.";
 }
}
main();
</script>
</body>
</html>
